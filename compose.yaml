name: hscode

x-app: &app
  image: hscode-mcp:local
  build:
    context: .
    args:
      PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
      DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
  networks: [default]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    HSCODE_LOG_LEVEL: ${HSCODE_LOG_LEVEL:-INFO}
    HS_MODEL_CACHE: /cache/models
    HS_MODEL_PATH: ${HS_MODEL_PATH:-}
    HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
    HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
  volumes:
    - model_cache:/cache

services:
  vectors:
    <<: *app
    profiles: ["vectors"]
    command: ["hscode-build-vectors", "--threads", "${VECTOR_THREADS:-4}"]
    healthcheck:
      disable: true
    restart: "no"

  app:
    <<: *app
    command: ["hscode", "--http", "8765", "--host", "0.0.0.0", "--stateless"]
    ports:
      - "${HSCODE_BIND_HOST:-0.0.0.0}:${HSCODE_PORT:-8765}:8765"
    restart: unless-stopped

  export:
    <<: *app
    profiles: ["tools"]
    command: ["hscode-export", "--output-dir", "/exports"]
    volumes:
      - ./data:/exports
    healthcheck:
      disable: true
    restart: "no"

volumes:
  model_cache:

networks:
  default:
    driver: bridge
